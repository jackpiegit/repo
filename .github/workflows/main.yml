name: Build Repo

on:
  push:
    paths:
      - "deb/**"     # <-- triggers on add / edit / delete

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Install dpkg tools
      run: sudo apt-get update && sudo apt-get install -y dpkg-dev

    - name: Generate Packages file
      run: |
        if [ -d "deb" ]; then
          dpkg-scanpackages deb /dev/null > Packages || true
        else
          echo "" > Packages
        fi

    - name: Compress Packages.gz
      run: gzip -c Packages > Packages.gz

    - name: Commit and push changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add Packages Packages.gz
        git commit -m "Auto-update repo index" || echo "No changes to commit"
        git push
